<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses · Result Hub</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <section class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Courses</h1><p class="muted">Manage the courses that results are recorded against.</p></div></section>
    <div th:replace="~{fragments :: messages}"></div>
    <section class="panel"><div class="panel-heading"><div><h2>Course catalogue</h2><p class="muted" th:text="${courses.size() + ' course(s)'}"></p></div>
        <input type="search" data-table-filter placeholder="Search courses…" aria-label="Search courses"></div>
        <div class="table-wrap"><table><thead><tr><th>Course code</th><th>Course name</th><th>Credits</th><th>Semester</th></tr></thead>
            <tbody><tr th:each="course : ${courses}" data-filter-row><td class="strong" th:text="${course.courseCode}"></td><td th:text="${course.courseName}"></td><td th:text="${course.credits}"></td><td th:text="${course.semester}"></td></tr>
            <tr th:if="${courses.isEmpty()}"><td colspan="4" class="empty">No courses added yet.</td></tr></tbody></table></div>
    </section>
    <section class="panel form-panel"><div class="panel-heading"><div><h2>Add a course</h2><p class="muted">Leave the course code blank to generate one.</p></div></div>
        <form th:action="@{/admin/courses}" method="post" class="form-grid">
            <label>Course name<input name="courseName" maxlength="100" required></label>
            <label>Course code<input name="courseCode" maxlength="40"></label>
            <label>Credits<input type="number" name="credits" min="0" max="12" value="3" required></label>
            <label>Semester<input type="number" name="semester" min="1" max="12" value="1" required></label>
            <div class="span-2"><button class="button primary" type="submit">Save course</button></div>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body></html>
