<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Account · Result Hub</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <section class="page-heading"><div><p class="eyebrow">STUDENT PORTAL</p><h1>My account</h1><p class="muted">View your profile and update your password.</p></div></section>
    <div th:replace="~{fragments :: messages}"></div>
    <section class="account-grid">
        <article class="panel"><div class="panel-heading"><div><h2>Student profile</h2><p class="muted">Your personal details</p></div></div>
            <dl class="profile" th:if="${student != null}">
                <dt>Name</dt><dd th:text="|${student.firstName} ${student.lastName ?: ''}|"></dd>
                <dt>Roll number</dt><dd th:text="${student.rollNumber}"></dd>
                <dt>Email</dt><dd th:text="${student.email ?: '—'}"></dd>
                <dt>Phone</dt><dd th:text="${student.phone ?: '—'}"></dd>
                <dt>Date of birth</dt><dd th:text="${student.dateOfBirth}"></dd>
                <dt>Gender</dt><dd th:text="${student.gender ?: '—'}"></dd>
                <dt>Address</dt><dd th:text="${student.address ?: '—'}"></dd>
                <dt>Enrolled</dt><dd th:text="${student.enrollmentDate}"></dd>
            </dl>
            <p class="empty" th:if="${student == null}">No student profile is linked to this account. Contact your administrator.</p>
        </article>
        <article class="panel"><div class="panel-heading"><div><h2>Change password</h2><p class="muted">Use at least 8 characters.</p></div></div>
            <form th:action="@{/student/account/password}" method="post" class="form-stack">
                <label>Current password<input type="password" name="currentPassword" autocomplete="current-password" required></label>
                <label>New password<input type="password" name="newPassword" minlength="8" autocomplete="new-password" required></label>
                <label>Confirm new password<input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></label>
                <button class="button primary" type="submit">Update password</button>
            </form>
        </article>
    </section>
</main>
</body></html>
